{% assign p = page.url %}
{% if p contains '/posts/' %}
  {% if p contains '/en' or p contains '/en.html' %}
    <a class="lang-switch" href="{{ p | replace: '/en.html', '/zh.html' | replace: '/en', '/zh' }}">中文</a>
  {% elsif p contains '/zh' or p contains '/zh.html' %}
    <a class="lang-switch" href="{{ p | replace: '/zh.html', '/en.html' | replace: '/zh', '/en' }}">English</a>
  {% endif %}
{% endif %}
